<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <title>SafeMap</title>

  <!-- Leaflet -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Mapa -->
  <div id="map" aria-label="Mapa de reportes de seguridad"></div>

  <!-- Filtros (placeholder: lo desarrolla feature/report-filters) -->
  <div id="filtros" class="filtros" role="toolbar" aria-label="Filtros por categoría">
    <!-- Botones de categoría inyectados por ui.js -->
  </div>

  <!-- Botón de reporte de un toque -->
  <button id="btn-reportar" class="btn-reportar" aria-label="Crear reporte aquí">
    + Reportar
  </button>

  <!-- Panel inferior de reportes (placeholder: feature/ui-bottom-sheet lo hace deslizable) -->
  <section id="panel" class="panel" aria-label="Reportes activos">
    <div class="panel__handle" aria-hidden="true"></div>
    <header class="panel__header">
      <h1 class="panel__title">Reportes cercanos</h1>
      <span id="panel-contador" class="panel__contador">0</span>
    </header>
    <ul id="lista-reportes" class="lista-reportes"></ul>
  </section>

  <!-- Selector de categoría al crear reporte -->
  <div id="modal-categoria" class="modal" hidden>
    <div class="modal__contenido" role="dialog" aria-modal="true" aria-label="Elegir categoría">
      <h2 class="modal__titulo">¿Qué quieres reportar?</h2>
      <div id="modal-opciones" class="modal__opciones"></div>
      <button id="modal-cancelar" class="modal__cancelar">Cancelar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Módulos SafeMap (orden importa) -->
  <script src="config.js"></script>
  <script src="reports.js"></script>
  <script src="map.js"></script>
  <script src="geolocation.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
